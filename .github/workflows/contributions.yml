name: Update contribution visuals

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visuals:
    name: Generate contribution visuals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/github-contribution-grid-snake.svg?palette=github-dark
            output/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8b5cf6

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ profile-3d-contrib/
          git commit -m "Update contribution visuals" || exit 0
          git push
